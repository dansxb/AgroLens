# ============================================================
# AgroLens — Local Development Services
# Start everything: docker-compose up
# Stop and remove volumes: docker-compose down -v
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 15 with PostGIS 3.x
  # postgis/postgis:15-3.4 is AMD64 only — platform: linux/amd64
  # tells Docker to run it via Rosetta on Apple Silicon (M1/M2/M3).
  # ----------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: agrolens_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agrolens_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agrolens} -d ${POSTGRES_DB:-agrolens_dev}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Redis 7 — Celery broker + result backend
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agrolens_redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        exec redis-server --appendonly yes;
      fi'
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping;
        else
          redis-cli ping;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: agrolens_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override database host to use the docker service name
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agrolens}:${POSTGRES_PASSWORD:-agrolens}@postgres:5432/${POSTGRES_DB:-agrolens_dev}"
      DATABASE_SYNC_URL: "postgresql://${POSTGRES_USER:-agrolens}:${POSTGRES_PASSWORD:-agrolens}@postgres:5432/${POSTGRES_DB:-agrolens_dev}"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-}@redis:6379/1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------------------------
  # Celery Worker
  # ----------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: agrolens_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agrolens}:${POSTGRES_PASSWORD:-agrolens}@postgres:5432/${POSTGRES_DB:-agrolens_dev}"
      DATABASE_SYNC_URL: "postgresql://${POSTGRES_USER:-agrolens}:${POSTGRES_PASSWORD:-agrolens}@postgres:5432/${POSTGRES_DB:-agrolens_dev}"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-}@redis:6379/1"
    volumes:
      - ./backend:/app:cached
      - ./ml:/app/ml:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=2

  # ----------------------------------------------------------
  # Celery Beat Scheduler
  # ----------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: agrolens_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agrolens}:${POSTGRES_PASSWORD:-agrolens}@postgres:5432/${POSTGRES_DB:-agrolens_dev}"
      DATABASE_SYNC_URL: "postgresql://${POSTGRES_USER:-agrolens}:${POSTGRES_PASSWORD:-agrolens}@postgres:5432/${POSTGRES_DB:-agrolens_dev}"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-}@redis:6379/1"
    volumes:
      - ./backend:/app:cached
      - ./ml:/app/ml:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # ----------------------------------------------------------
  # Next.js Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: agrolens_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
