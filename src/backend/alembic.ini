# ============================================================
# AgroLens — Alembic Configuration
# Run migrations from the backend/ directory:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "description"
# ============================================================

[alembic]
# Path to the alembic directory (relative to this file)
script_location = alembic

# Template used for migration script file names
file_template = %%(rev)s_%%(slug)s

# The sqlalchemy.url is intentionally not set here.
# It is read from the DATABASE_SYNC_URL environment variable
# in alembic/env.py, ensuring no credentials are stored in this file.
# sqlalchemy.url = (intentionally blank — see alembic/env.py)

# Timezone for revision timestamps
timezone = UTC

# Max length of the revision slug
truncate_slug_length = 60

# Output encoding for migration scripts
output_encoding = utf-8

# Version table name (default: alembic_version)
version_table = alembic_version

[post_write_hooks]
# Optional: auto-format generated migration files with Black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
